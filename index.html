*{box-sizing:border-box}
:root{--bg:#0d0d0d;--card:#151514;--card2:#100f0e;--line:#262624;--line2:#1c1c1a;--txt:#d6d6d3;--strong:#fff;--mut:#a3a39f;--soft:#8d8d89;--gold:#e8b84b;--red:#d03b3b;--track:#20201d;--chip:#23231f;--sqline:#33302c;--grid:rgba(232,232,230,.05);--fbg:#0f1a11;--fline:#2c3a2e;
--disp:'Bebas Neue','DejaVu Sans Condensed','Arial Narrow',Impact,sans-serif;--body:Poppins,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',Consolas,monospace}
html{scroll-behavior:smooth;background:var(--bg)}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--txt);font:400 19px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
b,strong{color:var(--strong);font-weight:600}
a{color:var(--gold)}
img{max-width:100%}
button{font-family:inherit}
h1,h2,h3,h4{margin:0;font-weight:400}
p{margin:0}
.devbanner{position:fixed;z-index:99;left:0;right:0;bottom:0;background:#a21;color:#fff;font:700 12px var(--mono);text-align:center;padding:3px;letter-spacing:1px;pointer-events:none}
.wrap{max-width:1340px;margin:0 auto;padding:0 28px}

/* barra fixa */
.topbar{position:fixed;z-index:50;top:0;left:0;right:0;background:rgba(13,13,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:24px}
.brand-link{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand-link .l4{height:30px}.brand-link .cr{height:40px}.brand-link .x{font:400 24px var(--disp);color:var(--red)}
#navlinks{display:flex;gap:6px;flex:1;justify-content:center}
#navlinks a{color:var(--mut);text-decoration:none;font:600 14px var(--body);letter-spacing:1.5px;text-transform:uppercase;padding:9px 14px;border-radius:8px}
#navlinks a:hover{color:#fff}
#navlinks a.on{color:#fff;background:#1f1f1c;box-shadow:inset 0 -2px 0 var(--red)}
.langs{display:flex;gap:8px;flex:none}
.langs button{font:700 18px/1 var(--body);letter-spacing:1px;color:#e8e8e6;background:#1a1a18;border:2px solid #44423d;border-radius:10px;min-width:60px;height:46px;padding:0 16px;cursor:pointer}
.langs button:hover{border-color:#8a867c}
.langs button.on{background:var(--red);border-color:var(--red);color:#fff}
.langs button:focus-visible,#navlinks a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-top:68px}

/* tipografia */
.kick{font:600 15px/1.2 var(--body);letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
section h2{font:400 clamp(40px,5.2vw,68px)/1 var(--disp);letter-spacing:1px;color:#fff;border-left:8px solid var(--red);padding-left:20px;margin-bottom:34px}
.blk{margin-top:84px}
.blk h3{font:400 clamp(30px,3.4vw,42px)/1.05 var(--disp);letter-spacing:.8px;color:#fff}
.blead{color:var(--mut);margin:6px 0 22px;font-size:19px}
.srclink{display:inline-block;margin-top:46px;font:600 15px var(--mono);letter-spacing:1px;text-decoration:none;color:var(--mut);border-bottom:1px solid #4a4742}
.srclink:hover{color:var(--gold)}
section{scroll-margin-top:70px}

/* avatar */
.av{position:relative;flex:none;display:block;width:var(--s,80px);height:var(--s,80px);border-radius:50%;border:4px solid var(--gold);overflow:hidden;background:radial-gradient(circle at 50% 30%,#4a2222,#1a1414 75%)}
.av i{position:absolute;inset:0;background-size:150% auto;background-position:50% 2%;background-repeat:no-repeat}
.av.mono{background:#2b2b28;border-color:#5b5649;display:flex;align-items:center;justify-content:center;font:400 calc(var(--s,80px)*.42)/1 var(--disp);color:#c9c5b8}
.av.sm{border-width:3px}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 16px;font:500 18px/1.2 var(--body);color:#e8e8e6;margin:0 8px 8px 0}
.pill b{color:var(--gold)}
.pill.gold{background:#2a230f;border-color:#6a5314;color:var(--gold)}

/* hero */
.hero{padding:70px 0 80px;background:radial-gradient(1100px 600px at 80% 30%,rgba(208,59,59,.28),transparent 62%),radial-gradient(800px 500px at 10% 100%,rgba(232,184,75,.12),transparent 62%),linear-gradient(180deg,#120d0d,#0d0d0d)}
.hero h1{font:400 clamp(46px,7vw,100px)/.95 var(--disp);letter-spacing:1.5px;color:#fff;max-width:1000px}
.hsub{font:300 clamp(20px,2.2vw,28px)/1.35 var(--body);color:#ececea;margin:20px 0 40px;max-width:760px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pcard{display:flex;align-items:flex-end;background:linear-gradient(135deg,#1b1313,#141413);border:1px solid var(--sqline);border-radius:26px;overflow:hidden;min-height:420px;position:relative}
.pcard.palmberg{background:linear-gradient(135deg,#1c1810,#141413)}
.pcard .ph{position:absolute;right:-30px;bottom:0;width:62%;line-height:0}
.pcard .ph:before{content:'';position:absolute;left:12%;right:0;top:14%;bottom:0;background:radial-gradient(circle at 50% 35%,rgba(208,59,59,.4),transparent 65%)}
.pcard.palmberg .ph:before{background:radial-gradient(circle at 50% 35%,rgba(232,184,75,.35),transparent 65%)}
.pcard .ph img{position:relative;width:100%;height:auto}
.pcard .pi{position:relative;z-index:2;padding:30px 28px;max-width:60%;align-self:flex-start}
.pcard h2{font:400 clamp(40px,4vw,56px)/1 var(--disp);border:0;padding:0;margin:0 0 6px;color:#fff}
.pcard .role{font:600 18px var(--body);color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
.hdate{margin-top:26px;font:400 15px var(--mono);color:var(--soft);letter-spacing:1px}

/* por qué encajan */
.why-sec{padding:90px 0}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.why{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 30px;display:flex;flex-direction:column}
.why .wh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.why .who{font:600 15px var(--mono);letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.why h3{font:400 34px/1.05 var(--disp);color:#fff;letter-spacing:.6px}
.why .big{font:400 110px/1 var(--disp);color:var(--gold);margin:6px 0 2px}
.why .big small{font:400 22px var(--body);color:var(--mut);margin-left:12px;letter-spacing:0;display:inline-block;vertical-align:middle;max-width:55%;line-height:1.25}
.why .cmp{font:500 20px/1.4 var(--body);color:#ececea;margin-top:6px}
.why .ctx{font:400 16px/1.5 var(--body);color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:12px}

/* seções de jogador */
.psec{padding:90px 0 70px;border-top:1px solid var(--line2)}
.psec.g{background:linear-gradient(180deg,#110f0a,#0d0d0d 40%)}
.shead{display:flex;align-items:center;gap:22px;margin-bottom:34px}
.shead h2{margin:0}
.ficha{display:grid;grid-template-columns:380px 1fr;gap:44px;align-items:start}
.portrait{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--sqline);background:radial-gradient(circle at 50% 28%,rgba(208,59,59,.4),#161414 72%);line-height:0}
.portrait.g{background:radial-gradient(circle at 50% 28%,rgba(232,184,75,.32),#161414 72%)}
.portrait img{width:100%;height:auto;display:block}
.fr h3{font:400 32px/1.1 var(--disp);color:#fff;margin:22px 0 12px;letter-spacing:.8px}
.facts{display:flex;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:400 46px/1 var(--disp);color:var(--gold)}
.stat span{font:400 15px/1.3 var(--body);color:var(--mut)}
.tits{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tits li{background:#1d1708;border:1px solid #6a5314;color:var(--gold);border-radius:999px;padding:6px 16px;font:500 16px var(--body)}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.hc .rk{font:600 15px var(--mono);letter-spacing:2px;color:var(--gold)}
.hc .v{font:400 64px/1 var(--disp);color:#fff;margin:4px 0}
.hc .l{font:400 16px/1.35 var(--body);color:var(--txt)}
.cap{margin-top:12px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* radar */
.radwrap{display:grid;grid-template-columns:minmax(0,460px) 1fr;gap:34px;align-items:center}
.radar{width:100%;height:auto}
.radar .ring{fill:none;stroke:#2c2b28;stroke-width:1.5}
.radar .axis{stroke:#2c2b28;stroke-width:1.5}
.radar .poly{fill:rgba(232,184,75,.28);stroke:var(--gold);stroke-width:3.5}
.radar .dot{fill:var(--gold)}
.radar .nb{fill:#23231f;stroke:#4a4742;stroke-width:1.5}
.radar text{font:700 17px var(--mono);fill:#e8e8e6;text-anchor:middle;dominant-baseline:central}
.ml{display:grid;gap:8px}
.ml .r{display:grid;grid-template-columns:34px 1fr auto 62px;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:18px}
.ml .r i{font:700 16px var(--mono);font-style:normal;color:var(--gold)}
.ml .r em{font:600 18px var(--mono);color:#fff;font-style:normal}
.ml .r u{font:700 18px var(--mono);color:var(--gold);text-decoration:none;text-align:right}
.ml .rb{grid-column:2/5;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:block}
.ml .rb s{display:block;height:100%;background:var(--gold);border-radius:3px}

/* tabelas */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}
.tbl th{font:600 15px/1.15 var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);text-align:right;padding:0 12px 12px;border-bottom:2px solid #34322e;vertical-align:bottom}
.tbl th:first-child,.tbl td:first-child{text-align:left;width:25%;padding-left:12px}
.tbl th small{display:block;font:400 14px/1.25 var(--mono);letter-spacing:0;text-transform:none;color:var(--soft);margin-top:4px}
.tbl th.ath{color:#fff}
.tbl td{height:46px;padding:0 12px;text-align:right;font:500 21px/1 var(--body);color:#dcdcd8;border-bottom:1px solid #22221f;font-variant-numeric:tabular-nums}
.tbl td:first-child{font:400 25px/1 var(--disp);letter-spacing:.7px;color:#fff}
.tbl td.ath,.tbl th.ath{background:rgba(255,255,255,.045)}
.tbl td.best{color:var(--gold);font-weight:700}
.tbl td.none{color:#55534f}
.tbl td.med,.tbl th.med{color:#8d8d89;font-weight:400}
.tbl tr.sep td{border-top:2px dashed #6a5314}
.tnote{margin-top:14px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* mapas */
.mapsrow{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.mapcol h3{font:400 34px/1 var(--disp);letter-spacing:.8px;color:#fff;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mapcol h3 small{font:400 16px/1 var(--body);color:var(--mut);letter-spacing:0}
.mapcell{border-radius:16px;overflow:hidden;border:2px solid var(--fline);background:var(--fbg);aspect-ratio:105/68;position:relative}
.mapcell svg{display:block;width:100%;height:100%}
.maplegend{margin-top:8px;font:400 16px/1.35 var(--body);color:var(--mut);display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:24px}
.maplegend b{color:#fff}
.rampbar{display:inline-block;width:110px;height:12px;border-radius:6px;background:linear-gradient(90deg,#3a1414,#d03b3b,#e8b84b,#fff4c4)}
.pitch-t{font:400 66px var(--disp);fill:#14110a;text-anchor:middle;letter-spacing:.5px}
.pitch-t.s{font-size:46px}
.pitch-c{font:600 24px var(--body);fill:#14110a;text-anchor:middle}
.pitch-t.w,.pitch-c.w{fill:#fff}
.pnum{font:400 34px var(--disp);fill:#14110a;text-anchor:middle}

/* campo das funções */
.fn-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
.fn-pitch{border-radius:16px;overflow:hidden;border:2px solid var(--fline);background:var(--fbg);aspect-ratio:105/68}
.fn-pitch svg{display:block;width:100%;height:100%}
.zone{cursor:pointer}
.zone.hl rect.zr{stroke:#fff;stroke-width:5}
.fn-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fc{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;transition:background .2s}
.fc.soft{border-style:dashed;border-color:#7a6a3a}
.fc.hl{background:#1f1a0b}
.fc .lb{font:600 14px/1.15 var(--mono);letter-spacing:1.2px;color:var(--gold);text-transform:uppercase}
.fc .pc{font:400 68px/1 var(--disp);color:var(--gold);margin-top:2px;white-space:nowrap}
.fc .pc small{font:400 15px var(--body);color:var(--mut);margin-left:6px}
.fc .ds{font:400 16px/1.35 var(--body);color:var(--txt);margin-top:2px}
.fc .bar{margin-top:10px;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.fc .bar i{display:block;height:100%;background:var(--gold)}

/* contadores */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.counter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.counter .v{font:400 54px/1 var(--disp);color:var(--gold);white-space:nowrap}
.counter .l{font:400 15px/1.3 var(--body);color:var(--txt);margin-top:4px}
.natband{margin-top:16px;border:1px solid #6a5314;background:#1d1708;border-radius:14px;padding:14px 20px}
.natband p{font:500 19px/1.4 var(--body);color:#ece4cc}

/* semelhantes */
.simrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sim{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column}
.sim .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sim .pct{font:400 58px/1 var(--disp);color:var(--gold);white-space:nowrap}
.sim .pct small{font:400 24px var(--disp)}
.sim h4{font:400 30px/1.05 var(--disp);letter-spacing:.6px;color:#fff;margin-top:12px}
.sim .cx{font:400 14px/1.35 var(--mono);color:var(--mut);margin-top:6px;min-height:58px}
.sim ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.sim li{position:relative;padding:9px 0 9px 22px;font:400 17px/1.3 var(--body);color:#e4e4e1;border-bottom:1px solid #20201e}
.sim li:before{content:'';position:absolute;left:2px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--gold)}

/* vídeo */
.vwrap{max-width:900px}
.vwrap.vert{max-width:340px}
.vwrap.v169{max-width:900px}
.vwrap.v169 .vbox{aspect-ratio:16/9}
.vwrap.v45 .vbox{aspect-ratio:4/5}
.vwrap.vert .vbox{aspect-ratio:9/16}
.vbox video{display:block}
.vbox{border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--sqline);line-height:0}
.vbox video{width:100%;height:100%;object-fit:contain;background:#000}
.vtabs{display:flex;gap:10px;margin-top:12px}
.vtabs button{font:600 16px var(--mono);letter-spacing:1px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer}
.vtabs button.on{color:#111;background:var(--gold);border-color:var(--gold)}
.vph{padding:60px 20px;text-align:center;color:var(--mut);line-height:1.4}

/* encaje */
.enc{padding:90px 0;border-top:1px solid var(--line2);background:radial-gradient(900px 500px at 50% 0%,rgba(208,59,59,.14),transparent 65%)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.field{margin:0}
.field h3{font:400 38px/1.05 var(--disp);color:#fff;margin-bottom:12px}
.chg{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.chg li{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:12px 16px;font:400 18px/1.4 var(--body)}
.chg li b{display:block;font:400 28px/1.1 var(--disp);letter-spacing:.6px;color:#fff}
.enc .leg{margin-top:16px;font:400 16px/1.4 var(--body);color:var(--mut)}

/* próximos pasos */
.pasos{padding:80px 0;border-top:1px solid var(--line2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.step i{font:400 44px/1 var(--disp);color:var(--red);font-style:normal}
.step b{display:block;font:400 30px/1.05 var(--disp);letter-spacing:.7px;margin-top:2px}
.step p{font:400 17px/1.4 var(--body);margin-top:6px;color:var(--mut)}

/* fontes */
.fuentes{padding:50px 0;border-top:1px solid var(--line2)}
.fuentes summary{cursor:pointer;list-style:none;display:block;padding:14px 0}
.fuentes summary::-webkit-details-marker{display:none}
.fuentes summary h2{margin:0;display:inline-block}
.fuentes summary .kick{display:block}
.fuentes summary:after{content:'+';float:right;font:400 52px/1 var(--disp);color:var(--gold)}
.fuentes details[open] summary:after{content:'–'}
.mt{width:100%;min-width:760px;border-collapse:collapse;font-size:16px;line-height:1.45;margin-top:18px}
.mt th{font:600 14px/1.1 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);text-align:left;padding:0 10px 8px;border-bottom:2px solid #34322e}
.mt td{padding:9px 10px;border-bottom:1px solid #22221f;vertical-align:top;color:#dcdcd8}
.mt td:first-child{font:400 24px/1.1 var(--disp);color:#fff;white-space:nowrap}
.lim{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 26px;margin-top:26px}
.lim h3{font:400 32px/1 var(--disp);letter-spacing:.8px;color:#fff;margin-bottom:8px}
.lim ul{margin:0;padding:0 0 0 22px}
.lim li{font:400 16px/1.45 var(--body);margin-bottom:6px;color:#d4d4d1}
.lim li b{color:#fff}

/* contato */
.contact{padding:80px 0;border-top:1px solid var(--line2);text-align:center;background:radial-gradient(800px 400px at 50% 40%,rgba(208,59,59,.18),transparent 65%)}

.contact .ct{font:400 24px/1.6 var(--body);color:#ececea;margin-top:22px}
.contact .ct a{text-decoration:none}
.contact .pf{font:400 15px var(--mono);color:var(--mut);margin-top:30px;letter-spacing:1px}

const HTMLLANG = {pt: 'pt-PT', br: 'pt-BR', en: 'en'};
let lang = 'pt';
try { const s = localStorage.getItem(DOC.chave + '_lang'); if (s && HTMLLANG[s]) lang = s; } catch (e) {}
const t = o => (o === null || o === undefined) ? '' : (typeof o === 'string' ? o : (o[lang] || o.pt));
const nf = (x, d = 0) => { const s = Number(x).toFixed(d); return lang === 'en' ? s : s.replace('.', ','); };
const av = (src, s) => `<span class="av" style="--s:${s}px"><i style="background-image:url('${src}');background-size:150% auto;background-position:50% 4%"></i></span>`;
const sec = (id, kick, h, lead, body, cls = '') => `<section class="sec ${cls}" id="${id}"><div class="wrap"><div class="kick">${t(kick)}</div><h2>${t(h)}</h2>${lead ? `<p class="blead">${t(lead)}</p>` : ''}${body}</div></section>`;
const h3 = s => `<h3 class="h3x">${t(s)}</h3>`;
const nota = s => s ? `<p class="note">${t(s)}</p>` : '';
const kpis = it => `<div class="pk">${it.map(i => `<div><b>${t(i[0])}</b><span>${t(i[1])}</span></div>`).join('')}</div>`;
function bars(c) {
  const mx = c.max || Math.max(...c.rows.map(r => r[1]));
  return `<div class="bars">${c.rows.map(r => `<div class="row"><span>${t(r[0])}</span><div class="tr"><i class="${r[2] ? '' : 'g'}" style="width:${Math.max(2, r[1] / mx * 100)}%"></i></div><em>${nf(r[1], c.dec || 0)}${c.unit || ''}</em></div>`).join('')}</div>`;
}
function cmpBars(c) {
  const cols = ['linear-gradient(90deg,#7a2323,#e8b84b)', 'linear-gradient(90deg,#3b3b37,#8a8a84)', 'linear-gradient(90deg,#4a2a2a,#d03b3b)'], dots = ['#e8b84b', '#8a8a84', '#d03b3b'];
  const leg = `<div class="leg">${c.names.map((n, i) => `<span><i style="background:${dots[i]}"></i>${n}</span>`).join('')}</div>`;
  return leg + `<div class="cmpb">${c.rows.map(r => `<div class="row"><span>${t(r[0])}</span><div class="pair">${c.names.map((n, i) => `<div><div class="tr"><i style="width:${r[i + 1]}%;background:${cols[i]}"></i></div><em>${r[i + 1]}</em></div>`).join('')}</div></div>`).join('')}</div>`;
}

const npos = k => { const v = NOMEPOS[k] || [k, k]; return lang === 'en' ? v[1] : (lang === 'br' ? v[0].replace('Médio-centro', 'Meio-campista').replace('Ponta de lança', 'Centroavante').replace('Segundo avançado', 'Segundo atacante').replace('Defesa-central', 'Zagueiro').replace('Extremo esquerdo', 'Ponta-esquerda').replace('Extremo direito', 'Ponta-direita').replace('Médio interior esquerdo', 'Meio-campista pela esquerda').replace('Meio-campo esquerdo', 'Meia pela esquerda') : v[0]); };
function campo(W, H, extra) {
  const lin = '#34463a';
  return `<rect x="1" y="1" width="${W - 2}" height="${H - 2}" rx="6" fill="#101a12" stroke="#2c3a2e" stroke-width="2"/><line x1="1" y1="${H / 2}" x2="${W - 1}" y2="${H / 2}" stroke="${lin}" stroke-width="1.5"/><circle cx="${W / 2}" cy="${H / 2}" r="${W * 0.13}" fill="none" stroke="${lin}" stroke-width="1.5"/><rect x="${W * 0.21}" y="1" width="${W * 0.58}" height="${H * 0.16}" fill="none" stroke="${lin}" stroke-width="1.5"/><rect x="${W * 0.21}" y="${H * 0.84 - 1}" width="${W * 0.58}" height="${H * 0.16}" fill="none" stroke="${lin}" stroke-width="1.5"/>` + (extra || '');
}
const T3 = (p, e) => lang === 'en' ? e : p;
const rotulos = (W, H, P) => `<text x="${P + W / 2}" y="12" text-anchor="middle" class="mtx">${T3('ATAQUE ▲', 'ATTACK ▲')}</text><text x="${P + W / 2}" y="${H + 2 * P + 10}" text-anchor="middle" class="mtx">${T3('DEFESA', 'DEFENCE')}</text>` +
  `<text x="${P - 5}" y="${P + H / 2}" text-anchor="middle" class="mtx" transform="rotate(-90 ${P - 5} ${P + H / 2})">${T3('ESQUERDA', 'LEFT')}</text><text x="${P + W + 5}" y="${P + H / 2}" text-anchor="middle" class="mtx" transform="rotate(90 ${P + W + 5} ${P + H / 2})">${T3('DIREITA', 'RIGHT')}</text>`;
function mapaPosicoes(pos) {
  if (!pos || !pos.lista || !pos.lista.length) return '';
  const W = 200, H = 300, P = 16;
  let c = '';
  pos.lista.filter(p => p[1] >= 3).sort((a, b) => b[1] - a[1]).forEach(p => { const z = ZONA[p[0]] || [50, 50]; const r = 9 + Math.sqrt(p[1]) * 2.3; const x = z[1] / 100 * W, y = (1 - z[0] / 100) * H;
    c += `<circle cx="${x}" cy="${y}" r="${r}" fill="#f2c14e" fill-opacity=".92" stroke="#0b0d10" stroke-width="2"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="700" font-size="${r > 16 ? 13 : 10.5}" fill="#111">${Math.round(p[1])}%</text>`; });
  const s = `<svg class="mpos" viewBox="0 0 ${W + 2 * P} ${H + 2 * P + 14}" role="img" aria-label="${t(pos.titulo)}">${rotulos(W, H, P)}<g transform="translate(${P},${P + 4})">${campo(W, H, c)}</g></svg>`;
  const L = `<ul class="mposl">${pos.lista.filter(p => p[1] >= 1).map(p => `<li><b>${Math.round(p[1])}%</b> ${npos(p[0])}</li>`).join('')}</ul>`;
  return `<div class="mposw"><h5>${t(pos.titulo)}</h5><div class="mposg">${s}${L}</div><p class="mposn">${t(pos.nota)}</p></div>`;
}
function mapaAcoes(m) {
  if (!m || !m.grade) return '';
  const R = 15, K = 10, W = 200, H = 300, P = 16, cw = W / K, ch = H / R, g = m.grade;
  const G = Array.from({length: R}, (_, r) => Array.from({length: K}, (_, c) => g[2 * r][2 * c] + g[2 * r][2 * c + 1] + g[2 * r + 1][2 * c] + g[2 * r + 1][2 * c + 1]));
  const tot = G.flat().reduce((a, b) => a + b, 0) || 1, mx = Math.max(...G.flat()) || 1;
  const terc = [0, 0, 0], corr = [0, 0, 0];
  let cells = '';
  G.forEach((row, r) => row.forEach((x, c) => { terc[r < 5 ? 0 : (r < 10 ? 1 : 2)] += x; corr[c < 3 ? 0 : (c < 7 ? 1 : 2)] += x;
    const f = x / mx; if (f < .07) return;
    cells += `<rect x="${c * cw + 1.2}" y="${r * ch + 1.2}" width="${cw - 2.4}" height="${ch - 2.4}" rx="2.5" fill="#f2c14e" fill-opacity="${(.14 + .86 * Math.pow(f, .85)).toFixed(2)}"/>`; }));
  const pc = v => Math.round(100 * v / tot);
  const s = `<svg class="macao" viewBox="0 0 ${W + 2 * P} ${H + 2 * P + 14}" role="img" aria-label="${t(m.titulo)}">${rotulos(W, H, P)}<g transform="translate(${P},${P + 4})">${campo(W, H, cells)}</g></svg>`;
  const linha = (rot, v) => `<div class="mzr"><span>${rot}</span><i><em style="width:${pc(v)}%"></em></i><b>${pc(v)}%</b></div>`;
  const zonas = `<div class="mzs"><h5>${T3('Onde joga', 'Where he plays')}</h5>` + linha(T3('Terço ofensivo', 'Attacking third'), terc[0]) + linha(T3('Meio-campo', 'Middle third'), terc[1]) + linha(T3('Terço defensivo', 'Defensive third'), terc[2]) +
    `<div class="mzsep"></div>` + linha(T3('Corredor esquerdo', 'Left channel'), corr[0]) + linha(T3('Corredor central', 'Central channel'), corr[1]) + linha(T3('Corredor direito', 'Right channel'), corr[2]) +
    `<div class="mleg"><span>${T3('menos ações', 'fewer actions')}</span><i></i><span>${T3('mais', 'more')}</span></div></div>`;
  return `<div class="macw">${h3(m.titulo)}<div class="macg">${s}<div>${zonas}<p class="l" style="margin-top:14px">${t(m.texto)}</p></div></div>${nota(m.nota)}</div>`;
}
function video(vd) {
  if (!vd) return '';
  const local = !!vd.src && vd.src.indexOf('http') !== 0;
  if (!local) {   // externos (YouTube, Drive, Dropbox): link discreto, sem miniatura
    const url = vd.tipo === 'youtube' ? `https://www.youtube.com/watch?v=${vd.id}` : (vd.tipo === 'drive' ? `https://drive.google.com/file/d/${vd.id}/view` : vd.src);
    return `<p class="vlink"><a href="${url}" target="_blank" rel="noopener">▶ ${t(vd.titulo)}</a></p>`;
  }
  return `${h3(vd.titulo)}<figure class="vid"><video controls preload="metadata" playsinline src="${vd.src}"></video>${vd.legenda ? `<figcaption>${t(vd.legenda)}</figcaption>` : ''}</figure>`;
}
function dispersao(d) {
  if (!d) return '';
  const W = 900, H = 500, m = {l: 64, r: 24, t: 20, b: 56}; const P = d.pontos;
  const xs = P.map(p => p.x), ys = P.map(p => p.y); const x0 = Math.min(...xs) * .95, x1 = Math.max(...xs) * 1.03, y0 = Math.min(...ys) * .97, y1 = Math.max(...ys) * 1.02;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const med = a => { const s = [...a].sort((p, q) => p - q), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
  let s = `<svg class="scat" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t(d.titulo)}">`;
  s += `<line x1="${X(med(xs))}" y1="${m.t}" x2="${X(med(xs))}" y2="${H - m.b}" stroke="#555" stroke-dasharray="5 5"/><line x1="${m.l}" y1="${Y(med(ys))}" x2="${W - m.r}" y2="${Y(med(ys))}" stroke="#555" stroke-dasharray="5 5"/>`;
  s += `<text x="${(m.l + W - m.r) / 2}" y="${H - 10}" text-anchor="middle" font-size="15" fill="#c9c9c4" font-family="Poppins,sans-serif">${t(d.xlab)}</text><text transform="translate(18 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="15" fill="#c9c9c4" font-family="Poppins,sans-serif">${t(d.ylab)}</text>`;
  P.forEach((p, i) => { if (!p.alvo) s += `<circle class="dot" data-d="${d.id}" data-n="${i}" cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="#6b6b66" fill-opacity=".75" stroke="transparent" stroke-width="14" pointer-events="all"><title>${p.nome}</title></circle>`; });
  P.forEach((p, i) => { if (p.alvo) s += `<circle class="dot" data-d="${d.id}" data-n="${i}" cx="${X(p.x)}" cy="${Y(p.y)}" r="11" fill="#e8b84b" stroke="#fff" stroke-width="2.5"/><text x="${X(p.x) + 15}" y="${Y(p.y) + 5}" font-size="17" font-weight="700" fill="#e8b84b" font-family="Poppins,sans-serif" pointer-events="none">${p.nome}</text>`; });
  return `${h3(d.titulo)}${s}</svg><div class="scinfo" id="sc_${d.id}">${lang === 'en' ? 'Click a dot to see who the player is.' : 'Clique num ponto para ver quem é o jogador.'}</div>${nota(d.nota)}`;
}
document.addEventListener('click', e => {
  const dt = e.target.closest('.dot'); if (!dt) return; const d = (window.__DISP || {})[dt.dataset.d]; if (!d) return; const p = d.pontos[+dt.dataset.n];
  document.querySelectorAll(`.dot[data-d="${dt.dataset.d}"]`).forEach(x => x.classList.toggle('sel', x === dt));
  document.getElementById('sc_' + d.id).innerHTML = `<b>${p.nome}</b>${p.info ? ' · ' + t(p.info) : ''}`;
});
function pes(b) {
  if (!b) return '';
  const tot = b.e + b.d;
  return `${h3(b.titulo)}<div class="pes"><div><b>${b.e}</b><span>${lang === 'en' ? 'left foot' : 'pé esquerdo'}</span></div><div class="pbar"><i style="width:${b.e / tot * 100}%"></i><i style="width:${b.d / tot * 100}%"></i></div><div><b>${b.d}</b><span>${lang === 'en' ? 'right foot' : 'pé direito'}</span></div></div><p class="l">${t(b.texto)}</p>${nota(b.nota)}`;
}
function lideres(b) {
  const nf2 = v => lang === 'en' ? v.toFixed(2) : v.toFixed(2).replace('.', ',');
  const ml = v => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'en' ? ',' : '.');
  const o = r => lang === 'en' ? ({1: '1st', 2: '2nd', 3: '3rd'}[r] || r + 'th') : r + 'º';
  return `${h3(b.titulo)}<div class="pk pk6 pkdc">${b.itens.map(s => `<div><b>${o(s.rank)}</b><span>${t(s.rot)}<br>${nf2(s.v90)} ${lang === 'en' ? 'per 90' : 'por 90'} · ${ml(s.total)} ${lang === 'en' ? 'total' : 'no total'}<br><small>${lang === 'en' ? 'among' : 'entre'} ${b.n}</small></span></div>`).join('')}</div>${nota(b.nota)}`;
}
function tabela(tb) {
  if (!tb) return '';
  return `${h3(tb.titulo)}<div class="tw"><table class="tb" style="min-width:560px"><thead><tr>${tb.cab.map(c => `<th>${t(c)}</th>`).join('')}</tr></thead><tbody>${tb.linhas.map(r => `<tr class="${r.alvo ? 'alvo' : ''}">${r.cel.map(c => `<td>${t(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${nota(tb.nota)}`;
}

const basicos = b => `<dl class="bs">${b.map(r => `<div><dt>${t(r[0])}</dt><dd>${t(r[1])}</dd></div>`).join('')}</dl>`;
function peca(p) {
  const ch = (p.charts || []).map(c => h3(c.titulo) + bars(c) + nota(c.nota)).join('');
  const cmp = p.cmp ? h3(p.cmp.titulo) + cmpBars(p.cmp) + nota(p.cmp.nota) : '';
  const cen = p.cen ? `<div class="cen" style="grid-template-columns:${p.cen.length > 1 ? '1fr 1fr' : '1fr'}">${p.cen.map(c => `<div><b>${t(c[0])}</b>${t(c[1])}</div>`).join('')}</div>` : '';
  const extra = (p.extra || []).map(x => `<p class="l" style="margin-top:16px">${t(x)}</p>`).join('');
  return `<section class="sec" id="${p.id}"><div class="wrap"><div class="kick">${t(p.kick)}</div><h2>${t(p.nome)}</h2><div class="pb"><div><div class="portrait"><img src="${p.foto}" alt="${t(p.nome)}"></div><div style="margin-top:16px"><p style="font:600 16px var(--body);color:var(--gold);letter-spacing:1px;text-transform:uppercase;line-height:1.35">${t(p.papel)}</p>${basicos(p.basicos)}${mapaPosicoes(p.posicoes)}</div></div><div><p class="l">${t(p.lead)}</p>${kpis(p.kpis)}${(p.blocos || []).map(b => b.tipo === 'pes' ? pes(b) : b.tipo === 'tabela' ? tabela(b) : b.tipo === 'dispersao' ? dispersao(b) : b.tipo === 'video' ? video(b) : b.tipo === 'lideres' ? lideres(b) : '').join('')}${ch}${mapaAcoes(p.mapa)}${cmp}${extra}${cen}${video(p.video)}</div></div></div></section>`;
}
function page() {
  const D = DOC;
  window.__DISP = {}; D.pecas.forEach(p => (p.blocos || []).forEach(b => { if (b.tipo === 'dispersao') window.__DISP[b.id] = b; }));
  const cards = D.pecas.map(p => `<a class="c4" href="#${p.id}">${av(p.foto, 150)}<h3>${t(p.nome)}</h3><div class="role">${t(p.papel_curto)}</div><div class="bsm">${t(p.mini)}</div><p>${t(p.capa)}</p></a>`).join('');
  const hero = `<section class="hero" id="inicio"><div class="wrap"><div class="kick">${t(D.conf)}</div><h1>${t(D.h1)}</h1><p class="hsub">${t(D.hsub)}</p><div class="p4 n${D.pecas.length}">${cards}</div></div></section>`;
  const C = D.clube;
  const boxes = C.caixas.map(b => `<div class="bx ${b.ok ? 'ok' : ''}"><b>${t(b.n)}</b><h4>${t(b.t)}</h4><p>${t(b.p)}</p></div>`).join('');
  const plantel = C.plantel ? `${h3(C.plantel.titulo)}<div class="rl">${C.plantel.itens.map(x => `<p>${t(x)}</p>`).join('')}</div>` : '';
  const clube = sec('clube', C.kick, C.h, C.lead, `<div class="bxs">${boxes}</div>${nota(C.nota)}${plantel}`, 'first');
  const G = D.lacunas;
  const lac = sec('lacunas', G.kick, G.h, null, `<div class="gaps">${G.itens.map((g, i) => `<div class="gap"><b class="nn">${String(i + 1).padStart(2, '0')}</b><h4>${t(g.t)}</h4><p>${t(g.p)}</p><div class="resp">${t(g.r)}</div></div>`).join('')}</div>`);
  const T = D.tecnico;
  const tb = (T.barras || []).map(c => `<div>${h3(c.titulo)}${bars(c)}${nota(c.nota)}</div>`).join('');
  const tec = sec('treinador', T.kick, T.h, T.lead, `<div class="rl">${T.paras.map(x => `<p>${t(x)}</p>`).join('')}</div>${tb ? `<div class="two">${tb}</div>` : ''}${nota(T.leitura)}`);
  const pecas = D.pecas.map(peca).join('');
  const E = D.encaixe;
  const rows = E.linhas.map(r => `<tr><td><div style="display:flex;align-items:center;gap:12px">${av(r.foto, 54)}<b>${t(r.nome)}</b></div></td><td style="min-width:220px">${t(r.add)}</td><td>${t(r.vaga)}</td><td>${t(r.par)}</td><td style="font-size:16px;min-width:250px">${t(r.dif)}</td></tr>`).join('');
  const enc = sec('encaixe', E.kick, E.h, E.lead, `<div class="tw"><table class="tb" style="min-width:960px"><thead><tr>${E.cab.map(c => `<th>${t(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>${nota(E.nota)}`);
  const K = D.carteira;
  const crt = sec('carteira', K.kick, K.h, K.lead, `<div class="cart">${K.cards.map(c => `<div class="cc">${av(c.foto, 84)}<div><h4>${c.nome}</h4><div class="cmeta">${t(c.meta)}</div><div class="cclub">${t(c.clube)}</div><p>${t(c.l)}</p></div></div>`).join('')}</div>${nota(K.nota)}`);
  const S = D.passos;
  const pas = sec('passos', S.kick, S.h, null, `<div class="rl">${S.itens.map(x => `<p>${t(x)}</p>`).join('')}</div>${nota(S.nota)}`);
  const M = D.metodo;
  const met = `<section class="fuentes" id="metodo"><div class="wrap"><details><summary><div class="kick">${t(M.kick)}</div><h2>${t(M.h)}</h2></summary><div class="mt">${M.itens.map(x => `<p>${t(x)}</p>`).join('')}</div></details></div></section>`;
  return hero + clube + lac + tec + pecas + enc + crt + pas + met + `<div id="footnote" class="wrap">4ComM · ${t(D.conf)}</div>`;
}
function nav() { document.getElementById('navlinks').innerHTML = DOC.nav.map(x => `<a href="#${x[0]}">${t(x[1])}</a>`).join(''); }
function render() {
  document.documentElement.lang = HTMLLANG[lang]; document.title = t(DOC.titulo); nav();
  document.getElementById('page').innerHTML = page();
  document.querySelectorAll('.langs button').forEach(b => { const on = b.dataset.l === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l; try { localStorage.setItem(DOC.chave + '_lang', lang); } catch (e) {}
  const y = window.scrollY; render(); window.scrollTo(0, y);
}));
const tt = document.getElementById('toTop');
window.addEventListener('scroll', () => { tt.style.display = window.scrollY > 600 ? 'block' : 'none'; });
tt.addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
render();

</script>
</body>
